name: QA and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Bilingual content, links, mobile/desktop QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser testing tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Check bilingual static pages and local assets
        run: python qa/check_site.py

      - name: Check responsive pages and interactions
        run: python qa/check_responsive.py

      - name: Upload responsive screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: balkazar-responsive-qa
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
